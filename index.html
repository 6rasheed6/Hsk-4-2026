<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HSK 4 Pro Trainer</title>
<style>
:root{--bg:#0d0d0f;--surface:#141418;--card:#1a1a20;--border:#2a2a35;--red:#e05252;--gold:#c9a84c;--blue:#5b8dd9;--green:#52b788;--text:#e8e2d9;--muted:#6b6578;--soft:#9b94a8;--ok:#52b788;--bad:#e05252}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}#progressBar{height:2px;background:linear-gradient(90deg,var(--gold),var(--red));position:fixed;top:0;left:0;z-index:200}header{padding:1.4rem 1.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(13,13,15,.97);backdrop-filter:blur(8px);z-index:100}.header-top{display:flex;justify-content:space-between;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}.badge{background:var(--red);color:white;font-size:.62rem;letter-spacing:.14em;padding:.25rem .6rem;border-radius:3px;display:inline-block;margin-bottom:.5rem}h1{font-family:Georgia,serif;font-size:clamp(1.5rem,4vw,2.35rem);font-weight:600;line-height:1.1}h1 span{color:var(--gold);font-style:italic}.stats{display:flex;gap:1rem;font-size:.72rem;color:var(--muted);flex-wrap:wrap}.stats strong{color:var(--gold)}.controls,.mode-tabs{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center}.mode-tabs{margin-bottom:.8rem}.search-wrap{flex:1;min-width:220px;max-width:430px}.search-wrap input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:.65rem .8rem;color:var(--text);outline:none}.search-wrap input:focus{border-color:var(--gold)}button{font-family:inherit}.btn,.filter-btn,.view-btn,.mode-btn{background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:.7rem;padding:.5rem .8rem;cursor:pointer}.btn:hover,.filter-btn:hover,.view-btn:hover,.mode-btn:hover{color:var(--text);border-color:var(--soft)}.filter-btn.active,.view-btn.active,.mode-btn.active,.btn.gold{background:var(--gold);color:#0d0d0f;border-color:var(--gold);font-weight:700}.btn.ok{background:var(--ok);border-color:var(--ok);color:#07110d;font-weight:700}.btn.bad{background:var(--bad);border-color:var(--bad);color:white;font-weight:700}.filter-group{display:flex;gap:.4rem;flex-wrap:wrap}.section{display:none}.section.active{display:block}.panel{max-width:1000px;margin:1.2rem auto;padding:1rem 1.2rem;background:var(--card);border:1px solid var(--border);border-radius:10px}.panel h2{font-size:1.1rem;margin-bottom:.7rem;color:var(--gold)}.progress-wrap{background:var(--surface);border:1px solid var(--border);border-radius:999px;height:12px;overflow:hidden;margin:.5rem 0 1rem}.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:0%}.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}.dash-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.85rem}.dash-card .num{font-size:1.6rem;color:var(--gold);font-weight:bold}.dash-card .lbl{font-size:.72rem;color:var(--muted);margin-top:.25rem}#resultCount{padding:.7rem 1.5rem;font-size:.72rem;color:var(--muted);max-width:1400px;margin:0 auto}#wordGrid{padding:1.5rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.8rem;max-width:1400px;margin:0 auto}#wordGrid.list-view{grid-template-columns:1fr;max-width:880px}.word-card{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:1rem 1.1rem;cursor:pointer;position:relative;transition:.18s}.word-card:hover,.word-card.expanded{border-color:var(--gold);transform:translateY(-1px)}.card-top{display:flex;justify-content:space-between;gap:.5rem;padding-right:1.4rem}.cn-big{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:1.65rem;font-weight:700;line-height:1.15}.word-num{color:var(--muted);font-size:.6rem}.py{color:var(--red);font-size:.75rem;margin:.35rem 0 .2rem}.en{color:var(--soft);font-size:.78rem;line-height:1.4}.card-bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:.55rem}.pos-tag{display:inline-block;font-size:.6rem;padding:.16rem .5rem;border-radius:20px;border:1px solid var(--muted);color:var(--muted)}.pos-v{border-color:var(--blue);color:var(--blue)}.pos-n{border-color:var(--green);color:var(--green)}.pos-adj,.pos-a{border-color:var(--gold);color:var(--gold)}.pos-adv,.pos-d{border-color:#b48ead;color:#b48ead}.pos-conj,.pos-c{border-color:#d08770;color:#d08770}.audio-btn{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:.75rem;padding:.2rem .48rem;cursor:pointer}.audio-btn:hover{background:var(--gold);color:#0d0d0f;border-color:var(--gold)}.studied-btn{position:absolute;top:.75rem;right:.75rem;border:0;background:transparent;cursor:pointer;opacity:.35;font-size:.82rem}.studied-btn.on,.studied-btn:hover{opacity:1}.expanded-panel{display:none;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)}.word-card.expanded .expanded-panel{display:block}.ex-block{margin-bottom:.85rem}.ex-cn{font-family:"Noto Serif SC","Microsoft YaHei",serif;font-size:.98rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;line-height:1.45}.ex-py{color:var(--red);font-size:.7rem;margin-top:.2rem}.ex-en{color:var(--soft);font-size:.72rem;margin-top:.15rem}.empty-state{text-align:center;padding:4rem 1rem;color:var(--muted)}.error{max-width:900px;margin:2rem auto;padding:1rem;border:1px solid var(--red);color:var(--text);background:#211719;border-radius:8px;line-height:1.7}.flash-box,.quiz-box{max-width:760px;margin:1.2rem auto;padding:1.3rem;background:var(--card);border:1px solid var(--border);border-radius:12px;text-align:center}.flash-cn{font-size:4rem;font-family:"Noto Serif SC","Microsoft YaHei",serif;margin:1rem 0}.flash-hidden{filter:blur(7px);user-select:none}.flash-answer{margin:1rem auto;padding:1rem;border-top:1px solid var(--border);color:var(--soft);line-height:1.7}.quiz-option{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.75rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer}.quiz-option.correct{border-color:var(--ok);background:#10231a}.quiz-option.wrong{border-color:var(--bad);background:#291719}.small{font-size:.72rem;color:var(--muted)}.review-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.7rem;margin-top:.8rem}.mini-word{padding:.8rem;background:var(--surface);border:1px solid var(--border);border-radius:8px}.mini-word strong{font-size:1.4rem}.mini-word p{font-size:.72rem;color:var(--soft);margin-top:.25rem}@media(max-width:600px){header{padding:1rem}#wordGrid{padding:1rem;grid-template-columns:1fr}.flash-cn{font-size:3.2rem}.panel,.flash-box,.quiz-box{margin:1rem;padding:1rem}}
</style>
</head>
<body>
<div id="progressBar" style="width:0%"></div>
<header>
  <div class="header-top">
    <div><div class="badge">HSK 4 PRO TRAINER</div><h1>HSK 4 <span>全词汇</span> Word List</h1></div>
    <div class="stats"><span>📚 <strong id="totalCount">0</strong> words</span><span>✅ <strong id="studiedCount">0</strong> studied</span><span>🎯 <strong id="masteredCount">0</strong> mastered</span><span>🔁 <strong id="reviewCount">0</strong> review</span></div>
  </div>
  <div class="mode-tabs">
    <button class="mode-btn active" onclick="setMode(this,'words')">Words</button>
    <button class="mode-btn" onclick="setMode(this,'flashcards')">Flashcards</button>
    <button class="mode-btn" onclick="setMode(this,'quiz')">Quiz</button>
    <button class="mode-btn" onclick="setMode(this,'review')">Daily Review</button>
    <button class="mode-btn" onclick="setMode(this,'progress')">Progress</button>
  </div>
  <div class="controls" id="wordControls">
    <div class="search-wrap"><input id="searchInput" placeholder="Search Chinese, pinyin, or English..." oninput="filterWords()"></div>
    <div class="filter-group">
      <button class="filter-btn active" onclick="setPOS(this,'all')">All</button><button class="filter-btn" onclick="setPOS(this,'v')">Verb</button><button class="filter-btn" onclick="setPOS(this,'n')">Noun</button><button class="filter-btn" onclick="setPOS(this,'a')">Adj</button><button class="filter-btn" onclick="setPOS(this,'d')">Adv</button><button class="filter-btn" onclick="setPOS(this,'c')">Conj</button><button class="filter-btn" onclick="setPOS(this,'hard')">Hard</button><button class="filter-btn" onclick="setPOS(this,'studied')">⭐ Studied</button>
    </div>
    <div><button class="view-btn active" onclick="setView(this,'grid')">⊞</button><button class="view-btn" onclick="setView(this,'list')">☰</button></div>
  </div>
</header>

<section id="words" class="section active"><div id="resultCount">Loading HSK 4 words...</div><div id="wordGrid"></div></section>
<section id="flashcards" class="section"><div class="flash-box" id="flashBox">Loading...</div></section>
<section id="quiz" class="section"><div class="quiz-box" id="quizBox">Loading...</div></section>
<section id="review" class="section"><div class="panel"><h2>Daily Review</h2><p class="small">Words due today appear here. Correct answers push the next review forward. Wrong answers return tomorrow.</p><div id="reviewPanel"></div></div></section>
<section id="progress" class="section"><div class="panel"><h2>Progress Dashboard</h2><div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div><div class="dash-grid" id="dashGrid"></div></div></section>

<script>
const SOURCES=['https://raw.githubusercontent.com/drkameleon/complete-hsk-vocabulary/main/wordlists/exclusive/old/4.json','https://cdn.jsdelivr.net/gh/drkameleon/complete-hsk-vocabulary@main/wordlists/exclusive/old/4.json','https://raw.githubusercontent.com/drkameleon/complete-hsk-vocabulary/main/complete.json'];
let words=[];let currentFilter='all';let currentSearch='';let currentView='grid';let currentMode='words';let flashIndex=0;let flashShown=false;let quizCurrent=null;let quizLocked=false;let studied=JSON.parse(localStorage.getItem('hsk4_studied')||'[]');let progress=JSON.parse(localStorage.getItem('hsk4_progress')||'{}');const exampleCache={};
function today(){return new Date().toISOString().slice(0,10)}
function addDays(days){const d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function getProg(id){if(!progress[id])progress[id]={correct:0,wrong:0,level:0,nextReview:today(),last:''};return progress[id]}
function saveAll(){localStorage.setItem('hsk4_studied',JSON.stringify(studied));localStorage.setItem('hsk4_progress',JSON.stringify(progress));updateStats()}
function normalizeEntry(item,idx){const form=(item.forms||item.f||[])[0]||{};const trans=form.transcriptions||form.i||{};const meanings=form.meanings||form.m||item.meanings||item.en||item.translation||[];const posRaw=item.pos||item.p||[];const level=item.level||item.l||[];return{id:idx+1,cn:item.simplified||item.s||item.word||item.w||item.cn||'',py:trans.pinyin||trans.y||item.pinyin||item.py||'',en:Array.isArray(meanings)?meanings.join('; '):String(meanings||''),pos:Array.isArray(posRaw)?posRaw.join('/'):String(posRaw||'other'),level:Array.isArray(level)?level:[level]}}
async function loadWords(){let lastError='';for(const url of SOURCES){try{const res=await fetch(url,{cache:'force-cache'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();let arr=Array.isArray(data)?data:(data.words||data.data||[]);arr=arr.map(normalizeEntry).filter(w=>w.cn);if(url.includes('complete.json'))arr=arr.filter(w=>w.level.includes('old-4')||w.level.includes('o4'));const seen=new Set();words=arr.filter(w=>!seen.has(w.cn)&&seen.add(w.cn)).map((w,i)=>({...w,id:i+1}));if(words.length){renderAll();return}}catch(e){lastError=e.message}}document.getElementById('wordGrid').innerHTML=`<div class="error">Could not load the HSK 4 list. Check internet connection, then refresh. Error: ${lastError}</div>`}
function escapeAttr(text){return String(text).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function makeExamples(w){return[{cn:`我正在学习“${w.cn}”这个词。`,py:`Wǒ zhèngzài xuéxí “${w.py}” zhège cí.`,en:`I am studying the word “${w.en}”.`},{cn:`这个句子里可以用“${w.cn}”。`,py:`Zhège jùzi lǐ kěyǐ yòng “${w.py}”.`,en:'This sentence can use this word.'},{cn:`我觉得“${w.cn}”是HSK4里很重要的词。`,py:`Wǒ juéde “${w.py}” shì HSK4 lǐ hěn zhòngyào de cí.`,en:'I think this is an important HSK 4 word.'}]}
function difficulty(w){const p=getProg(w.id);return (p.wrong*2)-p.correct+(p.level<2?1:0)}
function getFiltered(){const q=currentSearch.toLowerCase().trim();let list=words.filter(w=>{const pos=String(w.pos||'');const p=getProg(w.id);const isHard=currentFilter==='hard'?difficulty(w)>0:true;const matchPOS=currentFilter==='all'||currentFilter==='hard'?isHard:currentFilter==='studied'?studied.includes(w.id):pos.includes(currentFilter);const matchSearch=!q||String(w.cn).includes(q)||String(w.py).toLowerCase().includes(q)||String(w.en).toLowerCase().includes(q);return matchPOS&&matchSearch});if(currentFilter==='hard')list=list.sort((a,b)=>difficulty(b)-difficulty(a));return list}
function renderGrid(){const grid=document.getElementById('wordGrid');grid.className=currentView==='list'?'list-view':'';const filtered=getFiltered();document.getElementById('resultCount').textContent=`Showing ${filtered.length} of ${words.length} words`;if(!filtered.length){grid.innerHTML='<div class="empty-state"><h2>找不到</h2><p>No words match your search.</p></div>';return}grid.innerHTML=filtered.map(w=>{const isStudied=studied.includes(w.id);const posClass=String(w.pos||'other').split('/')[0];const p=getProg(w.id);const state=p.level>=3?'Mastered':p.correct>0?'Learning':p.wrong>0?'Review':'New';return `<div class="word-card" id="card_${w.id}" onclick="toggleCard(${w.id})"><button class="studied-btn ${isStudied?'on':''}" onclick="event.stopPropagation();toggleStudied(${w.id})">⭐</button><div class="card-top"><div class="cn-big">${w.cn}</div><div class="word-num">#${w.id}</div></div><div class="py">${w.py}</div><div class="en">${w.en}</div><div class="small">${state} • Correct: ${p.correct} • Wrong: ${p.wrong}</div><div class="card-bottom-row"><span class="pos-tag pos-${posClass}">${w.pos||'other'}</span><button class="audio-btn" onclick="event.stopPropagation();speak('${escapeAttr(w.cn)}',0.75)">🔊</button></div><div class="expanded-panel" id="panel_${w.id}"><div class="ex-en">Click to show examples</div></div></div>`}).join('')}
function toggleCard(id){const card=document.getElementById(`card_${id}`);const panel=document.getElementById(`panel_${id}`);const isOpen=card.classList.contains('expanded');document.querySelectorAll('.word-card.expanded').forEach(c=>c.classList.remove('expanded'));if(isOpen)return;card.classList.add('expanded');if(exampleCache[id]){panel.innerHTML=exampleCache[id];return}const w=words.find(x=>x.id===id);const html=makeExamples(w).map(ex=>`<div class="ex-block"><div class="ex-cn">${ex.cn}<button class="audio-btn" onclick="event.stopPropagation();speak('${escapeAttr(ex.cn)}',0.75)">🔊</button></div><div class="ex-py">${ex.py}</div><div class="ex-en">${ex.en}</div></div>`).join('');exampleCache[id]=html;panel.innerHTML=html}
function speak(text,rate=.8){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=rate;const voices=window.speechSynthesis.getVoices();const cnVoice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith('zh'));if(cnVoice)u.voice=cnVoice;window.speechSynthesis.speak(u)}if(window.speechSynthesis){window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices()}
function recordAnswer(id,ok){const p=getProg(id);p.last=today();if(ok){p.correct++;p.level=Math.min(4,(p.level||0)+1);p.nextReview=addDays([1,2,4,7,14][p.level]||14);if(p.level>=3&&!studied.includes(id))studied.push(id)}else{p.wrong++;p.level=0;p.nextReview=addDays(1)}saveAll();if(currentMode==='words')renderGrid();if(currentMode==='progress')renderProgress();if(currentMode==='review')renderReview()}
function toggleStudied(id){studied=studied.includes(id)?studied.filter(x=>x!==id):[...studied,id];const p=getProg(id);if(studied.includes(id))p.level=Math.max(p.level,3);saveAll();renderAll()}
function setMode(el,mode){currentMode=mode;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(mode).classList.add('active');document.getElementById('wordControls').style.display=mode==='words'?'flex':'none';if(mode==='flashcards')renderFlashcard();if(mode==='quiz')startQuiz();if(mode==='review')renderReview();if(mode==='progress')renderProgress()}
function renderFlashcard(){if(!words.length)return;const list=[...words].sort((a,b)=>difficulty(b)-difficulty(a));const w=list[flashIndex%list.length];document.getElementById('flashBox').innerHTML=`<div class="small">Flashcard ${flashIndex+1} / ${list.length} • sorted by difficulty</div><div class="flash-cn">${w.cn}</div><button class="audio-btn" onclick="speak('${escapeAttr(w.cn)}',0.75)">🔊 Listen</button><div class="flash-answer ${flashShown?'':'flash-hidden'}"><div class="py">${w.py}</div><div>${w.en}</div></div><div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem"><button class="btn gold" onclick="flashShown=!flashShown;renderFlashcard()">${flashShown?'Hide':'Show'} Answer</button><button class="btn bad" onclick="recordAnswer(${w.id},false);flashIndex++;flashShown=false;renderFlashcard()">I don’t know</button><button class="btn ok" onclick="recordAnswer(${w.id},true);flashIndex++;flashShown=false;renderFlashcard()">I know</button><button class="btn" onclick="flashIndex++;flashShown=false;renderFlashcard()">Skip</button></div>`}
function startQuiz(){if(words.length<4)return;quizLocked=false;const pool=[...words].sort((a,b)=>difficulty(b)-difficulty(a));quizCurrent=pool[Math.floor(Math.random()*Math.min(pool.length,80))];const options=[quizCurrent];while(options.length<4){const r=words[Math.floor(Math.random()*words.length)];if(!options.some(x=>x.id===r.id))options.push(r)}options.sort(()=>Math.random()-0.5);document.getElementById('quizBox').innerHTML=`<div class="small">Choose the correct meaning</div><div class="flash-cn">${quizCurrent.cn}</div><div class="py">${quizCurrent.py}</div><button class="audio-btn" onclick="speak('${escapeAttr(quizCurrent.cn)}',0.75)">🔊 Listen</button><div style="margin-top:1rem">${options.map(o=>`<button class="quiz-option" onclick="answerQuiz(this,${o.id})">${o.en}</button>`).join('')}</div><div id="quizMsg" class="small"></div>`}
function answerQuiz(btn,id){if(quizLocked)return;quizLocked=true;const ok=id===quizCurrent.id;btn.classList.add(ok?'correct':'wrong');document.querySelectorAll('.quiz-option').forEach(b=>{if(b.textContent===quizCurrent.en)b.classList.add('correct')});recordAnswer(quizCurrent.id,ok);document.getElementById('quizMsg').innerHTML=ok?'✅ Correct':'❌ Wrong';setTimeout(startQuiz,900)}
function renderReview(){const due=words.filter(w=>(getProg(w.id).nextReview||today())<=today()).sort((a,b)=>difficulty(b)-difficulty(a));document.getElementById('reviewCount').textContent=due.length;if(!due.length){document.getElementById('reviewPanel').innerHTML='<div class="empty-state"><h2>Great job ✅</h2><p>No words due today.</p></div>';return}document.getElementById('reviewPanel').innerHTML=`<div class="review-list">${due.map(w=>`<div class="mini-word"><strong>${w.cn}</strong><p>${w.py}</p><p>${w.en}</p><div style="margin-top:.6rem;display:flex;gap:.4rem"><button class="btn bad" onclick="recordAnswer(${w.id},false)">Wrong</button><button class="btn ok" onclick="recordAnswer(${w.id},true)">Correct</button><button class="audio-btn" onclick="speak('${escapeAttr(w.cn)}',0.75)">🔊</button></div></div>`).join('')}</div>`}
function renderProgress(){const total=words.length||1;const mastered=words.filter(w=>getProg(w.id).level>=3).length;const learning=words.filter(w=>{const p=getProg(w.id);return p.correct>0&&p.level<3}).length;const review=words.filter(w=>(getProg(w.id).nextReview||today())<=today()).length;const hard=[...words].sort((a,b)=>difficulty(b)-difficulty(a)).slice(0,8);const percent=Math.round((mastered/total)*100);document.getElementById('progressFill').style.width=percent+'%';document.getElementById('dashGrid').innerHTML=`<div class="dash-card"><div class="num">${percent}%</div><div class="lbl">Mastered progress</div></div><div class="dash-card"><div class="num">${mastered}</div><div class="lbl">Mastered</div></div><div class="dash-card"><div class="num">${learning}</div><div class="lbl">Learning</div></div><div class="dash-card"><div class="num">${review}</div><div class="lbl">Due today</div></div><div class="dash-card"><div class="num">${studied.length}</div><div class="lbl">Starred / studied</div></div><div class="dash-card"><div class="num">${words.reduce((s,w)=>s+getProg(w.id).wrong,0)}</div><div class="lbl">Total wrong answers</div></div>`;document.getElementById('dashGrid').insertAdjacentHTML('afterend',`<div id="hardBox"><h2 style="margin-top:1rem">Hardest words</h2><div class="review-list">${hard.map(w=>`<div class="mini-word"><strong>${w.cn}</strong><p>${w.py}</p><p>${w.en}</p><p class="small">Score: ${difficulty(w)} • Wrong: ${getProg(w.id).wrong}</p></div>`).join('')}</div></div>`)}
function updateStats(){document.getElementById('totalCount').textContent=words.length;document.getElementById('studiedCount').textContent=studied.length;document.getElementById('masteredCount').textContent=words.filter(w=>getProg(w.id).level>=3).length;document.getElementById('reviewCount').textContent=words.filter(w=>(getProg(w.id).nextReview||today())<=today()).length}
function renderAll(){updateStats();renderGrid();if(currentMode==='flashcards')renderFlashcard();if(currentMode==='review')renderReview();if(currentMode==='progress')renderProgress()}
function filterWords(){currentSearch=document.getElementById('searchInput').value;renderGrid()}
function setPOS(el,pos){currentFilter=pos;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderGrid()}
function setView(el,view){currentView=view;document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');renderGrid()}
window.addEventListener('scroll',()=>{const max=document.body.scrollHeight-window.innerHeight;document.getElementById('progressBar').style.width=(max>0?(window.scrollY/max)*100:0)+'%'});
loadWords();
</script>
</body>
</html>
